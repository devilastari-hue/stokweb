<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rekap Stok Barang</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📦</div>
      <h1>Rekap Stok Barang</h1>
      <p>Masuk ke akun Anda untuk melanjutkan</p>
    </div>

    <div id="error-msg" class="error-msg" style="display:none">
      <span>⚠️</span>
      <span id="error-text"></span>
    </div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="Masukkan username"
          autocomplete="username"
          required
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >
      </div>
      <button type="submit" class="btn-login" id="submit-btn">
        Masuk
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);">
      Rekap Stok Barang &copy; 2026 Kelompok 1
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
// Jika sudah login, redirect ke dashboard
(async () => {
  try {
    const me = await api.get('/api/auth/me');
    if (me.loggedIn) window.location.href = '/';
  } catch(e) {}
})();

const form = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');
const errorEl = document.getElementById('error-msg');
const errorText = document.getElementById('error-text');

function showError(msg) {
  errorText.textContent = msg;
  errorEl.style.display = 'flex';
}
function hideError() {
  errorEl.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Username dan password wajib diisi.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Memproses...';

  try {
    await api.post('/api/auth/login', { username, password });
    window.location.href = '/';
  } catch (err) {
    showError(err.message || 'Gagal login. Coba lagi.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Masuk';
  }
});
</script>
</body>
</html>
