[build]
  functions = "netlify/functions"
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200

# ADMIN_USERNAME is not a secret, and its value is a common word that appears
# in dependency code, so exclude it from secrets scanning.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USERNAME"
